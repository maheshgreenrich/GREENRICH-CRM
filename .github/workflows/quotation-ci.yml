name: Quotation and PDF workspace checks
on:
  pull_request:
    paths:
      - 'greenrich-quotations.*'
      - 'greenrich-quotation-mail.*'
      - 'greenrich-gmail-settings.*'
      - 'tests/multimail-settings.cjs'
      - 'supabase/migrations/20261116193000_mail_transport_configs.sql'
      - 'greenrich-contact-email.*'
      - 'greenrich-quotation-history.js'
      - 'tests/email-editor-history.cjs'
      - 'tests/rich-contact-email.cjs'
      - 'supabase/migrations/20261116203000_rich_email_multi_sender.sql'
      - 'greenrich-customer-profile.js'
      - 'greenrich-lead-profile.js'
      - 'greenrich-lead-pipeline.js'
      - 'greenrich-company-admin.js'
      - 'tests/gmail-settings-contact.cjs'
      - 'supabase/migrations/20261116183000_gmail_settings_contact_email.sql'
      - 'greenrich-quotation-history.js'
      - 'greenrich-crm-inline.js'
      - 'supabase/functions/greenrich-quotation-gmail/index.ts'
      - 'supabase/migrations/20261116170000_company_gmail_quotation_send.sql'
      - 'tests/quotation-gmail.cjs'
      - 'greenrich-pdf-workbench.js'
      - 'greenrich-one.js'
      - 'greenrich-inventory.*'
      - 'tests/inventory-wms-bom.cjs'
      - 'supabase/migrations/20261116213000_inventory_wms_foundation.sql'
      - 'greenrich-whatsapp-crm-workflows.js'
      - 'supabase/functions/greenrich-whatsapp-send/index.ts'
      - 'tests/whatsapp-send-diagnostics.cjs'
      - 'tests/whatsapp-template-payload.cjs'
      - 'supabase/functions/greenrich-socialberries/index.ts'
      - 'supabase/migrations/20261116234500_wa_bulk_batch_snapshots.sql'
      - 'tests/socialberries-bulk-batch-sync.cjs'
      - 'secure.html'
      - 'tests/quotation-workspace.cjs'
      - 'supabase/migrations/20261116110000_quotations_pdf_workspace.sql'
      - '.github/workflows/quotation-ci.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install DOM test dependencies
        run: npm ci --ignore-scripts
      - name: Verify quotation and PDF modules
        run: |
          node --check greenrich-one.js
          node --check greenrich-quotations.js
          node --check greenrich-pdf-workbench.js
          node tests/quotation-workspace.cjs
          node --check greenrich-quotation-mail.js
          node --check greenrich-quotation-history.js
          node --check greenrich-crm-inline.js
          node tests/quotation-gmail.cjs
          node tests/gmail-settings-contact.cjs
          node tests/multimail-settings.cjs
          node tests/rich-contact-email.cjs
          node tests/email-editor-history.cjs
          node tests/inventory-wms-bom.cjs
          node --check greenrich-whatsapp-crm-workflows.js
          node tests/whatsapp-send-diagnostics.cjs
          node tests/whatsapp-template-payload.cjs
          node tests/socialberries-bulk-batch-sync.cjs
          node --check greenrich-inventory.js
