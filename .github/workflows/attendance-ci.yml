name: Attendance V3 checks
on:
  push:
    branches: [main]
    paths:
      - 'attendance-v3.html'
      - 'attendance-v3.js'
      - 'attendance-v3.css'
      - 'supabase/functions/attendance-api/**'
      - 'supabase/migrations/20261029_attendance_v3*.sql'
      - 'supabase/tests/**'
      - '.github/workflows/attendance-ci.yml'
  pull_request:
    paths:
      - 'attendance-v3.html'
      - 'attendance-v3.js'
      - 'attendance-v3.css'
      - 'supabase/functions/attendance-api/**'
      - 'supabase/migrations/20261029_attendance_v3*.sql'
      - 'supabase/tests/**'
      - '.github/workflows/attendance-ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: attendance_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check frontend JavaScript
        run: node --check attendance-v3.js
      - name: Check TypeScript and dependency imports
        run: deno check supabase/functions/attendance-api/index.ts
      - name: Run API authorization and validation tests
        run: deno test supabase/functions/attendance-api/tests/attendance.test.ts
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Load isolated database schema
        env:
          PGPASSWORD: postgres
        run: |
          set -e
          export PGHOST=127.0.0.1 PGPORT=5432 PGUSER=postgres PGDATABASE=attendance_test
          psql -v ON_ERROR_STOP=1 -f supabase/tests/attendance_fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261029_attendance_v3.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261029_attendance_v3_ops.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261029_attendance_v3_assign.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/attendance_integration.sql
