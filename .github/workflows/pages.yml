name: Deploy GreenRich CRM to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CRM
        uses: actions/checkout@v4
      - name: Generate branded Android and desktop app icons
        env:
          BRAND_LOGO_URL: https://uawgwkplkvahhmhvroul.supabase.co/storage/v1/object/public/greenrich-branding/workspace/logo-1793332914856-f5ujd3qi.jpg?v=logo-1793332914856-f5ujd3qi.jpg
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 40 "$BRAND_LOGO_URL" -o /tmp/greenrich-brand-logo.jpg
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image,ImageOps
          source=Image.open('/tmp/greenrich-brand-logo.jpg').convert('RGBA')
          for size in (192,512):
              # Preserve the full company logo without stretching or clipping.
              icon=Image.new('RGBA',(size,size),'white')
              logo=ImageOps.contain(source,(int(size*.88),int(size*.88)),Image.Resampling.LANCZOS)
              icon.alpha_composite(logo,((size-logo.width)//2,(size-logo.height)//2))
              icon.convert('RGB').save(f'greenrich-app-{size}.png',format='PNG')
          PY
      - name: Verify required CRM and PWA files
        run: |
          set -euo pipefail
          for file in index.html secure.html field-tracker.html manifest.webmanifest greenrich-app-sw.js greenrich-install-app.js greenrich-app-192.png greenrich-app-512.png app-install-check.html; do
            test -s "$file" || { echo "::error::Missing required file: $file"; exit 1; }
          done
          python3 -m json.tool manifest.webmanifest >/dev/null
          echo "CRM and PWA files present"
      - name: Verify Inventory module before deployment
        run: |
          set -euo pipefail
          node --check greenrich-inventory.js
          node tests/inventory-product-summary.cjs
          node tests/inventory-conditional-smartbar.cjs
          node tests/inventory-product-sku-reference.cjs
          node tests/inventory-new-product.cjs
          node tests/inventory-new-product-page.cjs
          node tests/inventory-opening-stock-sku.cjs
          node tests/crm-onhand-forecast.cjs
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const window = {};
          vm.runInNewContext(fs.readFileSync('greenrich-inventory.js', 'utf8'), {window}, {filename: 'greenrich-inventory.js'});
          if (typeof window.GreenRichInventory?.mount !== 'function') {
            throw new Error('Inventory registration failed');
          }
          const html = fs.readFileSync('secure.html', 'utf8');
          if (!html.includes('greenrich-inventory.js?')) throw new Error('Inventory script missing in secure.html');
          console.log('Inventory module syntax and registration OK');
          NODE
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload complete CRM site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Wait for Pages artifact indexing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' | grep -Eq '^[0-9]+$'; then
              echo "Pages artifact is ready."
              exit 0
            fi
            echo "Waiting for GitHub artifact indexing: attempt ${attempt}/20"
            sleep 7
          done
          echo "::error::Pages artifact not indexed"
          exit 1
      - name: Deploy CRM to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live CRM and Android install files
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGES_URL%/}"
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsSL --max-time 15 "$base/secure.html?sha=${GITHUB_SHA}" -o /tmp/gr-secure.html &&
               curl -fsSL --max-time 15 "$base/app-install-check.html?sha=${GITHUB_SHA}" -o /tmp/gr-check.html &&
               curl -fsSL --max-time 15 "$base/manifest.webmanifest?sha=${GITHUB_SHA}" -o /tmp/gr-manifest.json &&
               curl -fsSL --max-time 15 "$base/greenrich-app-sw.js?sha=${GITHUB_SHA}" -o /tmp/gr-sw.js &&
               curl -fsSL --max-time 15 "$base/greenrich-app-192.png?sha=${GITHUB_SHA}" -o /tmp/gr-icon192.png &&
               curl -fsSL --max-time 15 "$base/greenrich-app-512.png?sha=${GITHUB_SHA}" -o /tmp/gr-icon512.png &&
               curl -fsSL --max-time 15 "$base/greenrich-inventory.js?sha=${GITHUB_SHA}" -o /tmp/gr-inventory.js &&
               node --check /tmp/gr-inventory.js &&
               grep -q 'GreenRichInventory' /tmp/gr-inventory.js &&
               cmp -s greenrich-inventory.js /tmp/gr-inventory.js &&
               cmp -s secure.html /tmp/gr-secure.html &&
               grep -q 'GreenRich ONE' /tmp/gr-secure.html &&
               grep -q 'App Install Check' /tmp/gr-check.html; then
              echo "LIVE: CRM and Android app assets published at $base"
              exit 0
            fi
            echo "Waiting for GitHub Pages to serve new release ($attempt/8)"
            sleep 10
          done
          echo "::error::GitHub Pages deployed but the new CRM/PWA files are not accessible"
          exit 1
