name: Deploy GreenRich CRM to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'greenrich-one.js'
      - 'greenrich-one.css'
      - 'demo.html'
      - 'demo.js'
      - 'attendance-ui.js'
      - 'legacy.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check required app files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          node --check app.js
          test -s greenrich-one.js
          test -s greenrich-one.css
          node --check greenrich-one.js
          test -s demo.html
          node --check demo.js
          node --check attendance-ui.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
