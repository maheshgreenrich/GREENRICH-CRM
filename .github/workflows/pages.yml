name: Deploy GreenRich CRM to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check required app files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          node --check app.js
          test -s greenrich-one.js
          test -s greenrich-one.css
          node --check greenrich-one.js
          node --check greenrich-sidebar.js
          node --check greenrich-branding.js
          node tests/sidebar-logo-responsive.js
          node --check greenrich-operations.js
          node --check greenrich-workflow-training.js
          node --check greenrich-erp-pilot.js
          node tests/connected-erp-pilot.js
          node tests/operations-product-workflow-training.js
          node --check greenrich-operations-seed.js
          node tests/operations-workflow-mapping.js
          node --check greenrich-company-admin.js
          node --check greenrich-customer-tags.js
          node --check greenrich-shared-customers.js
          node tests/shared-customers-and-tags.js
          node tests/sales-workflow-regression.js
          node tests/sales-overview-dashboard.js
          node tests/channel-dashboard-drilldown.js
          node tests/employee-company-access.js
          node tests/two-companies-settings-and-typography.js
          test -s greenrich-public-config.js
          node --check greenrich-public-config.js
          node tests/shared-login-regression.js
          test -s greenrich-crm-inline.js
          test -s greenrich-crm-inline.css
          node --check greenrich-crm-inline.js
          test -s greenrich-lead-pipeline.js
          node --check greenrich-lead-pipeline.js
          node --check greenrich-lead-profile.js
          node tests/lead-360-regression.js
          node tests/sales-queue-ux.js
          node --check greenrich-meta-sync.js
          node --check greenrich-sheet-manager.js
          node --check meta-sync-setup.js
          node tests/multi-sheet-lead-manager.js
          node tests/meta-google-sheet-integration.js
          node tests/lead-pipeline-page.js
          node --check greenrich-contacts.js
          node --check greenrich-sources.js
          node tests/unified-contacts-management.js
          node --check greenrich-dashboard.js
          node --check greenrich-dashboard-v2.js
          test -s greenrich-dashboard-v2.css
          node tests/modern-business-intelligence.js
          node --check greenrich-actions.js
          node tests/executive-dashboard-and-dispatch.js
          node --check greenrich-notifications.js
          node --check greenrich-followup-alarm.js
          node tests/modern-dashboard-won-followups.js
          node --check greenrich-customer-profile.js
          node tests/customer-360-profile.js
          node --check greenrich-sales-ops.js
          node tests/sales-dispatch-workflow.js
          node --check greenrich-invoices.js
          node --check greenrich-crm-cloud.js
          node tests/shared-crm-realtime.js
          node tests/invoice-per-sale.js
          node tests/invoice-settings-products.js
          node tests/one-page-crm-integration.js
          node tests/one-page-crm-layout.js
          test -s greenrich-attendance-inline.js
          node --check greenrich-attendance-inline.js
          node tests/attendance-inline-regression.js
          node tests/attendance-product-regression.js
          node tests/attendance-ui-refinement.js
          node tests/attendance-correction-layout.js
          node tests/attendance-monthly-reports.js
          node tests/dashboard-switch-performance.js
          test -s secure.html
          test -s roles.html
          test -s roles-manager.js
          test -s roles-manager.css
          node --check roles-manager.js
          test -s attendance-control.html
          test -s attendance-control.js
          test -s attendance-control.css
          node --check attendance-control.js
          test -s attendance-v3.html
          test -s attendance-v3.js
          test -s attendance-v3.css
          node --check attendance-v3.js
          test -s demo.html
          node --check demo.js
          node --check attendance-ui.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
