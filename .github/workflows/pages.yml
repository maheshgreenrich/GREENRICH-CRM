name: Deploy GreenRich CRM to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'greenrich-one.js'
      - 'greenrich-company-admin.js'
      - 'greenrich-customer-tags.js'
      - 'greenrich-shared-customers.js'
      - 'tests/shared-customers-and-tags.js'
      - 'tests/sales-workflow-regression.js'
      - 'tests/sales-overview-dashboard.js'
      - 'tests/channel-dashboard-drilldown.js'
      - 'tests/employee-company-access.js'
      - 'supabase/functions/greenrich-admin-users/index.ts'
      - 'tests/two-companies-settings-and-typography.js'
      - 'greenrich-public-config.js'
      - 'tests/shared-login-regression.js'
      - 'greenrich-crm-inline.js'
      - 'greenrich-sales-ops.js'
      - 'tests/sales-dispatch-workflow.js'
      - 'supabase/migrations/20261029221000_dispatch_handoff_orders.sql'
      - 'greenrich-invoices.js'
      - 'greenrich-invoices.css'
      - 'tests/invoice-per-sale.js'
      - 'tests/invoice-settings-products.js'
      - 'greenrich-crm-inline.css'
      - 'tests/one-page-crm-integration.js'
      - 'tests/one-page-crm-layout.js'
      - 'greenrich-attendance-inline.js'
      - 'tests/attendance-inline-regression.js'
      - 'tests/attendance-product-regression.js'
      - 'tests/attendance-ui-refinement.js'
      - 'tests/attendance-correction-layout.js'
      - 'tests/attendance-monthly-reports.js'
      - 'tests/dashboard-switch-performance.js'
      - 'greenrich-one.css'
      - 'demo.html'
      - 'secure.html'
      - 'roles.html'
      - 'roles-manager.js'
      - 'roles-manager.css'
      - 'attendance-control.html'
      - 'attendance-control.js'
      - 'attendance-control.css'
      - 'attendance-v3.html'
      - 'attendance-v3.js'
      - 'attendance-v3.css'
      - 'phase1/office-admin-attendance.sql'
      - 'demo.js'
      - 'attendance-ui.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check required app files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          node --check app.js
          test -s greenrich-one.js
          test -s greenrich-one.css
          node --check greenrich-one.js
          node --check greenrich-company-admin.js
          node --check greenrich-customer-tags.js
          node --check greenrich-shared-customers.js
          node tests/shared-customers-and-tags.js
          node tests/sales-workflow-regression.js
          node tests/sales-overview-dashboard.js
          node tests/channel-dashboard-drilldown.js
          node tests/employee-company-access.js
          node tests/two-companies-settings-and-typography.js
          test -s greenrich-public-config.js
          node --check greenrich-public-config.js
          node tests/shared-login-regression.js
          test -s greenrich-crm-inline.js
          test -s greenrich-crm-inline.css
          node --check greenrich-crm-inline.js
          node --check greenrich-sales-ops.js
          node tests/sales-dispatch-workflow.js
          node --check greenrich-invoices.js
          node tests/invoice-per-sale.js
          node tests/invoice-settings-products.js
          node tests/one-page-crm-integration.js
          node tests/one-page-crm-layout.js
          test -s greenrich-attendance-inline.js
          node --check greenrich-attendance-inline.js
          node tests/attendance-inline-regression.js
          node tests/attendance-product-regression.js
          node tests/attendance-ui-refinement.js
          node tests/attendance-correction-layout.js
          node tests/attendance-monthly-reports.js
          node tests/dashboard-switch-performance.js
          test -s secure.html
          test -s roles.html
          test -s roles-manager.js
          test -s roles-manager.css
          node --check roles-manager.js
          test -s attendance-control.html
          test -s attendance-control.js
          test -s attendance-control.css
          node --check attendance-control.js
          test -s attendance-v3.html
          test -s attendance-v3.js
          test -s attendance-v3.css
          node --check attendance-v3.js
          test -s demo.html
          node --check demo.js
          node --check attendance-ui.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
